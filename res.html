
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef2ff;
            padding: 30px 15px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px #00000015;
        }

        h1 {
            color: #3730a3;
            text-align: center;
            margin-bottom: 25px;
        }

        .student-info {
            background: #eef2ff;
            padding: 18px;
            border-radius: 10px;
            line-height: 2;
            margin-bottom: 25px;
        }

        h2 {
            color: #4338ca;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #4f46e5;
            color: white;
        }

        .summary {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            line-height: 2;
        }

        .status {
            font-size: 20px;
            font-weight: bold;
        }

        .pass {
            color: #15803d;
        }

        .fail {
            color: #dc2626;
        }

        button {
            margin-top: 20px;
            padding: 12px 18px;
            border: none;
            border-radius: 7px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #3730a3;
        }

        @media (max-width: 500px) {
            .container {
                padding: 18px;
            }

            th, td {
                padding: 8px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Student Result</h1>

        <div class="student-info" id="studentInfo"></div>

        <h2>Subject-wise Marks</h2>

        <table>
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                    <th>Result</th>
                </tr>
            </thead>
            <tbody id="marksTable"></tbody>
        </table>

        <div class="summary" id="summary"></div>

        <button onclick="window.location.href='index.html'">
            Back to Registration
        </button>
    </div>

    <script>
        const data = JSON.parse(localStorage.getItem("studentData"));

        const studentInfo = document.getElementById("studentInfo");
        const marksTable = document.getElementById("marksTable");
        const summary = document.getElementById("summary");

        if (!data) {
            studentInfo.textContent = "No student data found. Please register first.";
            document.querySelector("h2").style.display = "none";
            document.querySelector("table").style.display = "none";
            summary.style.display = "none";
        } else {
            studentInfo.innerHTML = `
                <strong>Name:</strong> ${escapeHTML(data.name)}<br>
                <strong>Roll Number:</strong> ${escapeHTML(data.roll)}<br>
                <strong>Email:</strong> ${escapeHTML(data.email)}<br>
                <strong>Class:</strong> ${escapeHTML(data.studentClass)}<br>
                <strong>Division:</strong> ${escapeHTML(data.division)}
            `;

            const subjects = [
                ["English", data.english],
                ["Mathematics", data.maths],
                ["Science", data.science],
                ["Computer Science", data.computer],
                ["History", data.history]
            ];

            let total = 0;
            let passed = true;

            subjects.forEach(function(subject) {
                const name = subject[0];
                const marks = subject[1];

                total += marks;

                if (marks < 35) {
                    passed = false;
                }

                marksTable.innerHTML += `
                    <tr>
                        <td>${name}</td>
                        <td>${marks}/100</td>
                        <td class="${marks >= 35 ? "pass" : "fail"}">
                            ${marks >= 35 ? "Pass" : "Fail"}
                        </td>
                    </tr>
                `;
            });

            const percentage = (total / 500) * 100;

            summary.innerHTML = `
                <h2>Final Summary</h2>
                <p><strong>Total Marks:</strong> ${total}/500</p>
                <p><strong>Percentage:</strong> ${percentage.toFixed(2)}%</p>
                <p><strong>Overall Result:</strong>
                    <span class="status ${passed ? "pass" : "fail"}">
                        ${passed ? "PASS" : "FAIL"}
                    </span>
                </p>
            `;
        }

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, function(char) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[char];
            });
        }
    </script>
</body>
</html>
